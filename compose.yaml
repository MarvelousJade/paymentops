services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ledger
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ledger}
    ports:
      # Host 15432: Windows Hyper-V excluded-port ranges swallow most of 5147-5763, taking 5432 with them.
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
