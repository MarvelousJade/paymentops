# Shadows the main application.yml on the test classpath — every property tests need lives here.
spring:
  cloud:
    aws:
      region:
        static: us-east-1
      credentials:
        access-key: test
        secret-key: test
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always

ledger:
  settlement:
    mode: sync
    queue: test-settlement
  internal:
    token: ""
  statements:
    dir: target/test-statements
  jwt:
    # Test-only key (48 bytes). Never reuse outside tests.
    secret: eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4
    access-ttl: 15m
    refresh-ttl: 7d
