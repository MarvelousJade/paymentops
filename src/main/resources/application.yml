spring:
  application:
    name: ledger-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ledger}
    username: ${DB_USER:ledger}
    password: ${DB_PASSWORD:ledger}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

ledger:
  jwt:
    # HMAC-SHA256 signing key, base64, min 32 bytes. No default: the app must not start with a guessable key.
    secret: ${JWT_SECRET}
    access-ttl: 15m
    refresh-ttl: 7d

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

server:
  error:
    include-stacktrace: never
