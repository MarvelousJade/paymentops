spring:
  application:
    name: paymentops
  cloud:
    aws:
      region:
        static: ${AWS_REGION:us-east-1}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:15432/ledger}
    username: ${DB_USER:ledger}
    password: ${DB_PASSWORD:ledger}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  batch:
    job:
      enabled: false # jobs run on schedule or on demand, never at startup
    jdbc:
      initialize-schema: always
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: record

ledger:
  settlement:
    # sync: settle in-request (local dev without AWS). async: 202 + SQS -> Lambda -> internal endpoint.
    mode: ${SETTLEMENT_MODE:sync}
    queue: ${SETTLEMENT_QUEUE:ledger-settlement}
  internal:
    # Shared secret for /internal/** (Lambda -> API). Blank disables the endpoints entirely.
    token: ${SERVICE_TOKEN:}
  rate-limit:
    transfers-per-minute: 60
  statements:
    dir: ${STATEMENTS_DIR:statements}
  jwt:
    # HMAC-SHA256 signing key, base64, min 32 bytes. No default: the app must not start with a guessable key.
    secret: ${JWT_SECRET}
    access-ttl: 15m
    refresh-ttl: 7d

paymentops:
  messaging:
    # local executes the same event consumers directly from the database outbox.
    # kafka publishes the envelope and uses retry/dead-letter topics.
    mode: ${PAYMENTOPS_MESSAGING_MODE:local}
  outbox:
    poll-delay-ms: ${OUTBOX_POLL_DELAY_MS:250}
    max-attempts: ${OUTBOX_MAX_ATTEMPTS:5}
  risk:
    per-transaction-limit-cents: ${RISK_TRANSACTION_LIMIT_CENTS:1000000}
    daily-limit-cents: ${RISK_DAILY_LIMIT_CENTS:2500000}
    velocity-review-count: ${RISK_VELOCITY_REVIEW_COUNT:10}
  settlement:
    behavior: ${SETTLEMENT_BEHAVIOR:SETTLE}
  webhook:
    endpoint: ${WEBHOOK_ENDPOINT:simulated://merchant}
    signing-secret: ${WEBHOOK_SIGNING_SECRET:local-development-only}
    max-attempts: ${WEBHOOK_MAX_ATTEMPTS:3}
    poll-delay-ms: ${WEBHOOK_POLL_DELAY_MS:1000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  metrics:
    tags:
      service: ${spring.application.name}

server:
  error:
    include-stacktrace: never

logging:
  file:
    name: ${LOG_FILE:}
