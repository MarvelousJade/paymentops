server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: paymentops
    static_configs:
      - targets: [localhost]
        labels:
          service: paymentops
          __path__: /var/log/paymentops/*.log
    pipeline_stages:
      - json:
          expressions:
            level: log.level
            trace_id: trace.id
            correlation_id: correlationId
      - labels:
          level:
