global:
  scrape_interval: 10s

scrape_configs:
  - job_name: paymentops
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["app:8080"]
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
  - job_name: kafka
    static_configs:
      - targets: ["kafka-exporter:9308"]
